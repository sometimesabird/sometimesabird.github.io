<body class="split">

                            <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><rect x="5.5" y="5.5" width="8" height="8" rx="1.5"/><path d="M10.5 3.5v-.5a1.5 1.5 0 0 0-1.5-1.5H4A1.5 1.5 0 0 0 2.5 3v5A1.5 1.5 0 0 0 4 9.5h.5"/></svg>

    <script>
        // copy-email button: revealed only where the clipboard API exists, so the
        // plain mailto link is all that shows without it
        (function () {
            var button = document.querySelector('.copy');
            var status = document.querySelector('.copied');
            if (!navigator.clipboard) return;
            var timer;
            button.hidden = false;
            button.addEventListener('click', function () {
                navigator.clipboard.writeText(button.dataset.copy).then(function () {
                    status.textContent = 'copied';
                }, function () {
                    status.textContent = 'copy failed';
                }).then(function () {
                    clearTimeout(timer);
                    timer = setTimeout(function () { status.textContent = ''; }, 1800);
                });
            });
        })();
    </script>
